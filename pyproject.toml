[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venvlib",
    ".devtools",
    ".tmp",
    "models",
    "data",
    "tools/pdf_extract.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # 长行交给格式与人工，不阻断
]

[tool.ruff.lint.per-file-ignores]
# 工具脚本要先 sys.path.insert 再 import，E402 是必然的
"tools/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = false
show_error_codes = true
exclude = '(^|/)(\.venvlib|\.devtools|models|data|tools/pdf_extract\.py)'
# 渐进式：先只检查核心模块，稳定后再扩大
files = ["app"]
