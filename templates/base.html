<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}JobPilot{% endblock %}</title>
<script>
  // 在首帧之前定好主题，避免闪白
  (function () {
    try {
      var saved = localStorage.getItem('jp-theme');
      var dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/chat">Job<em>Pilot</em></a>
  <nav>
    <a href="/chat" class="{{ 'active' if active == 'chat' else '' }}">Agent</a>
    <div class="nav-menu">
      <button type="button" class="nav-menu-btn">管理 ▾</button>
      <div class="nav-menu-list">
        <a href="/resumes">简历</a>
        <a href="/personal">个人库</a>
      </div>
    </div>
  </nav>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="切换深浅色" title="切换深浅色">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
  </button>
</header>

<main class="wrap">
  {% if msg %}<div class="banner banner-ok">{{ msg }}</div>{% endif %}
  {% if err %}<div class="banner banner-bad">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>

<footer class="foot">本地运行 · 数据不出本机</footer>

<div id="busy" class="busy" hidden>
  <div class="busy-box">
    <div class="spinner"></div>
    <div class="busy-text">处理中…</div>
  </div>
</div>

<script>
(function () {
  var busy = document.getElementById('busy');
  var text = busy.querySelector('.busy-text');

  function show(msg) {
    text.textContent = msg || '处理中…';
    busy.hidden = false;
  }
  function hide() { busy.hidden = true; }

  // 主题切换：写入 localStorage，下次打开沿用
  var toggle = document.getElementById('themeToggle');
  if (toggle) {
    toggle.addEventListener('click', function () {
      var root = document.documentElement;
      var dark = root.classList.toggle('dark');
      try { localStorage.setItem('jp-theme', dark ? 'dark' : 'light'); } catch (e) {}
    });
  }

  // 表单提交给出反馈、按钮禁用防重复提交。
  // 必须用冒泡阶段：页面自己用 preventDefault() 接管（fetch 提交）的表单，
  // 不应该再弹整屏遮罩——否则遮罩没人关，页面就卡在「处理中」。
  document.addEventListener('submit', function (e) {
    if (e.defaultPrevented) return;
    var form = e.target;
    if (!(form instanceof HTMLFormElement)) return;
    if (form.dataset.busy === 'skip') return;
    var btn = form.querySelector('button[type=submit], input[type=submit]');
    if (btn) {
      if (btn.tagName === 'BUTTON') {
        btn.dataset.oldText = btn.textContent;
        btn.textContent = '处理中…';
      } else {
        btn.dataset.oldValue = btn.value;
        btn.value = '处理中…';
      }
      btn.disabled = true;
    }
    show(form.dataset.busy || undefined);
  });

  // 整页刷新/回退时清掉遮罩，避免残留。
  window.addEventListener('pageshow', hide);
  window.addEventListener('beforeunload', hide);
})();
</script>
</body>
</html>
